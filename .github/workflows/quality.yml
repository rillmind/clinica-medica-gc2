name: Quality

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  # Job 1: Testes, cobertura e linter da aplicação (executa em qualquer branch)
  quality:
    name: Qualidade (testes, cobertura e linter)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Compilar o projeto (TypeScript)
        run: npm run build

      - name: Verificação de linter (tsc + eslint)
        run: npm run lint

      - name: Execução dos testes de unidade e integração
        run: npm test

      - name: Verificação da cobertura de código (>=90%)
        run: npm run test:coverage

  # Job 2: Construção da imagem Docker (executa em qualquer branch após os testes)
  docker-build:
    name: Construção da Imagem Docker
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Construir imagem Docker (validação sem push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'bryanbelo' }}/clinica-medica-gc2:test

  # Job 3: Publicação da imagem no DockerHub (executa apenas na baseline 'main')
  docker-publish:
    name: Publicação da Imagem no DockerHub
    runs-on: ubuntu-latest
    needs: [quality, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Autenticar no DockerHub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem no DockerHub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'bryanbelo' }}/clinica-medica-gc2:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'bryanbelo' }}/clinica-medica-gc2:${{ github.sha }}
